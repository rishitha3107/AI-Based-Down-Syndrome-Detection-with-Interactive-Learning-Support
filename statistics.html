<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DownCare | Global Statistics</title>
<link rel="stylesheet" href="style.css">

<!-- amCharts libraries -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<style>

#chartdiv {
width: 100%;
height: 650px;
margin-top: 20px;
}

</style>

</head>

<body>

<div class="container">

<div class="main-content">

<h2>Global Down Syndrome Statistics</h2>

<p>
Hover over a country to view prevalence levels (low, moderate, high).
</p>

<div id="chartdiv"></div>

</div>

</div>


<script>

fetch("http://127.0.0.1:5001/global-stats")
.then(response => response.json())
.then(countryStats => {

am5.ready(function(){

var root = am5.Root.new("chartdiv");

root.setThemes([
am5themes_Animated.new(root)
]);

// Create map
var chart = root.container.children.push(
am5map.MapChart.new(root,{
projection: am5map.geoMercator()
})
);

// Add world polygons
var polygonSeries = chart.series.push(
am5map.MapPolygonSeries.new(root,{
geoJSON: am5geodata_worldLow
})
);


// Default BLUE map
polygonSeries.mapPolygons.template.setAll({
fill: am5.color(0x4A90E2),
stroke: am5.color(0xffffff),
tooltipText: "{name}"
});


// Hover color logic
polygonSeries.mapPolygons.template.events.on("pointerover", function(ev){

var target = ev.target;
var id = target.dataItem.dataContext.id;

if(countryStats[id]){

var rate = countryStats[id].rate;

if(rate.includes("0.9")){
target.set("fill", am5.color(0x4CAF50)); // LOW → green
}
else if(rate.includes("1.5")){
target.set("fill", am5.color(0xF44336)); // HIGH → red
}
else{
target.set("fill", am5.color(0xFFC107)); // MEDIUM → yellow
}

}

});


// Reset color after hover
polygonSeries.mapPolygons.template.events.on("pointerout", function(ev){

ev.target.set("fill", am5.color(0x4A90E2));

});


// Tooltip statistics
polygonSeries.mapPolygons.template.adapters.add(
"tooltipText",
function(text,target){

var id = target.dataItem.dataContext.id;

if(countryStats[id]){

return target.dataItem.dataContext.name +
"\nRate: " + countryStats[id].rate +
"\nCases: " + countryStats[id].cases +
"\nRisk Factor: " + countryStats[id].risk_factor;

}

return target.dataItem.dataContext.name +
"\nData not available";

});

});

})
.catch(error => console.error("Map loading error:", error));

</script>

</body>
</html>
